<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vertical Slider</title>
    <link rel="stylesheet" href="slider.css" />
  </head>

  <body>
    <div class="slider-container">
      <div class="left-slider">
        <div class="slide slide-9">
          <h1>Insect Hashira</h1>
        </div>
        <div class="slide slide-8">
          <h1>Sound Hashira</h1>
        </div>
        <div class="slide slide-7">
          <h1>Flame Hashira</h1>
        </div>
        <div class="slide slide-6">
          <h1>Love Hashira</h1>
        </div>
        <div class="slide slide-5">
          <h1>Mist Hashira</h1>
        </div>
        <div class="slide slide-4">
          <h1>Serpent Hashira</h1>
        </div>
        <div class="slide slide-3">
          <h1>Water Hashira</h1>
        </div>
        <div class="slide slide-2">
          <h1>Wind Hashira</h1>
        </div>
        <div class="slide slide-1">
          <h1>Stone Hashira</h1>
        </div>
      </div>

      <div class="right-slider">
        <div class="slide"><img src="img/top1.jpg" alt="Slide 1" /></div>
        <div class="slide"><img src="img/top2.jpg" alt="Slide 2" /></div>
        <div class="slide"><img src="img/top3.jpg" alt="Slide 3" /></div>
        <div class="slide"><img src="img/top4.jpg" alt="Slide 4" /></div>
        <div class="slide"><img src="img/top5.jpg" alt="Slide 5" /></div>
        <div class="slide"><img src="img/top6.jpg" alt="Slide 6" /></div>
        <div class="slide"><img src="img/top7.jpg" alt="Slide 7" /></div>
        <div class="slide"><img src="img/top8.jpg" alt="Slide 8" /></div>
        <div class="slide"><img src="img/top9.jpg" alt="Slide 9" /></div>
      </div>

      <div class="slider-buttons">
        <button class="slider-button upward" aria-label="Previous slide">
          ▲
        </button>
        <button class="slider-button downward" aria-label="Next slide">
          ▼
        </button>
      </div>
    </div>
    <script src="slider.js"></script>
  </body>
</html>
